<title>วิธีทำงาน AiStyle — AiStyle</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --paper:#F3EEE4; --paper-2:#ECE5D7; --card:#FCFAF5; --ink:#211C16;
    --muted:#736A5C; --line:#DCD3C2; --teal:#0E6E63; --teal-deep:#0A4F47;
    --amber:#D9852A; --amber-soft:#FFF1D5; --warn:#B5642A; --r:18px;
    --shadow:0 14px 30px -22px rgba(33,28,22,.4);
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:"IBM Plex Sans Thai","IBM Plex Sans",sans-serif;
    font-size:16px;line-height:1.6;min-height:100vh;
    background-image:
      radial-gradient(circle at 90% -10%,rgba(217,133,42,.18),transparent 55%),
      radial-gradient(circle at -10% 110%,rgba(14,110,99,.14),transparent 50%);
  }
  .wrap{max-width:760px;margin:0 auto;padding:36px 22px 60px}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
  .back-link{
    font-family:"Chakra Petch",sans-serif;font-weight:600;font-size:.9rem;
    color:var(--teal-deep);text-decoration:none;display:inline-flex;align-items:center;gap:6px;
  }
  .back-link:hover{color:var(--teal)}
  .lang-toggle{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px}
  .lang-toggle button{
    font-family:"Chakra Petch",sans-serif;font-weight:600;font-size:.78rem;
    padding:5px 12px;border:none;border-radius:999px;background:transparent;cursor:pointer;color:var(--muted);
  }
  .lang-toggle button.active{background:var(--teal);color:#fff}

  h1{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:2rem;margin:0 0 10px;line-height:1.25}
  .lead{font-size:1.02rem;color:var(--muted);max-width:62ch;margin:0 0 24px}

  /* the two halves, side by side */
  .halves{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 18px}
  @media(max-width:560px){.halves{grid-template-columns:1fr}}
  .half{
    background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:16px 18px;box-shadow:var(--shadow);
  }
  .half .tag{
    font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:.74rem;
    text-transform:uppercase;letter-spacing:.06em;color:var(--teal);margin:0 0 4px;
  }
  .half h2{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:1rem;margin:0 0 4px}
  .half .time{font-size:.85rem;color:var(--muted);margin:0}

  .callout{
    background:var(--amber-soft);border:1px solid #EBD6AC;border-left:4px solid var(--amber);
    border-radius:12px;padding:16px 18px;margin:0 0 26px;
  }
  .callout h2{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:1rem;margin:0 0 8px;color:var(--warn)}
  .callout p{margin:0 0 7px;font-size:.93rem;line-height:1.65}
  .callout p:last-child{margin-bottom:0}

  .phase-head{
    font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:1.18rem;
    color:var(--teal-deep);margin:32px 0 4px;display:flex;align-items:center;gap:10px;
  }
  .phase-head::before{content:"";width:22px;height:3px;border-radius:2px;background:var(--amber);flex:0 0 auto}
  .phase-sub{font-size:.88rem;color:var(--muted);margin:0 0 16px;padding-left:32px}

  /* numbered steps */
  ol.steps{list-style:none;margin:0;padding:0}
  ol.steps > li{
    position:relative;padding:0 0 0 48px;margin:0 0 16px;
  }
  ol.steps > li::before{
    content:attr(data-n);position:absolute;left:0;top:0;
    width:32px;height:32px;border-radius:50%;
    background:var(--teal);color:#fff;
    font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:.92rem;
    display:flex;align-items:center;justify-content:center;
  }
  ol.steps > li.done::before{background:var(--teal-deep)}
  .step-card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;box-shadow:var(--shadow);
  }
  .step-card h3{
    font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:1rem;
    margin:0 0 6px;line-height:1.4;
  }
  .step-card p{margin:0 0 7px;font-size:.93rem;line-height:1.65;color:var(--ink)}
  .step-card p:last-child{margin-bottom:0}
  .step-card .note{color:var(--muted);font-size:.88rem}
  .step-card .warn{
    color:var(--warn);font-size:.88rem;font-weight:500;
    background:var(--amber-soft);border-radius:9px;padding:9px 11px;margin-top:9px;
  }
  .ui{
    font-family:"Chakra Petch",sans-serif;font-weight:600;
    background:var(--paper-2);border:1px solid var(--line);border-radius:7px;
    padding:1px 7px;font-size:.92em;
    /* a few button names are long enough to overflow a 320px screen, so let
       them wrap — clone keeps the border and padding on every line */
    overflow-wrap:anywhere;
    -webkit-box-decoration-break:clone;box-decoration-break:clone;
  }
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
  .chips span{
    background:var(--paper-2);border:1px solid var(--line);border-radius:999px;
    padding:4px 11px;font-size:.84rem;
  }

  .bigq{
    background:var(--teal-deep);color:#fff;border-radius:14px;
    padding:18px 20px;margin:10px 0 4px;
  }
  /* .step-card p paints its text dark, and these are p elements inside one —
     without this the question renders near-black on dark teal */
  .bigq .label,.bigq .q,.bigq .how{color:#fff}
  .bigq .label{
    font-family:"Chakra Petch",sans-serif;font-weight:600;font-size:.76rem;
    text-transform:uppercase;letter-spacing:.07em;opacity:.75;margin:0 0 7px;
  }
  .bigq .q{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:1.08rem;line-height:1.5;margin:0 0 10px}
  .bigq .how{font-size:.9rem;line-height:1.65;margin:0;opacity:.93}

  table.trouble{width:100%;border-collapse:collapse;font-size:.9rem}
  table.trouble th{
    text-align:left;font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:.84rem;
    color:var(--muted);border-bottom:2px solid var(--line);padding:0 10px 7px 0;
  }
  table.trouble td{border-bottom:1px solid var(--line);padding:10px 10px 10px 0;vertical-align:top;line-height:1.55}
  table.trouble tr:last-child td{border-bottom:none}
  table.trouble td:first-child{width:46%;font-weight:500}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:22px 24px;box-shadow:var(--shadow);margin-bottom:18px;
  }
  .card h2{
    font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:1.12rem;
    color:var(--teal-deep);margin:0 0 12px;display:flex;align-items:center;gap:10px;
  }
  .card h2::before{content:"";width:18px;height:3px;border-radius:2px;background:var(--amber);flex:0 0 auto}

  .foot{margin-top:28px;font-size:.85rem;color:var(--muted);text-align:center;line-height:1.7}
</style>
</head>

let currentLang = 'th';

/* {ui:…} marks a word the student has to find on screen. Everything else is
   escaped: only <b> from the authored strings above is allowed through. */
function render(text){
  return String(text)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/\{ui:([^}]+)\}/g, '<span class="ui">$1</span>')
    .replace(/&lt;b&gt;/g, '<b>').replace(/&lt;\/b&gt;/g, '</b>');
}

function buildSteps(containerId, steps, startAt, t){
  const ol = document.getElementById(containerId);
  ol.innerHTML = '';
  steps.forEach((s, i) => {
    const li = document.createElement('li');
    li.dataset.n = String(startAt + i);
    const card = document.createElement('div');
    card.className = 'step-card';

    const h = document.createElement('h3');
    h.innerHTML = render(s.h);
    card.appendChild(h);

    if(s.p){ const p = document.createElement('p'); p.innerHTML = render(s.p); card.appendChild(p); }
    if(s.p2){ const p = document.createElement('p'); p.innerHTML = render(s.p2); card.appendChild(p); }

    if(s.chips){
      const box = document.createElement('div');
      box.className = 'chips';
      s.chips.forEach(c => { const el = document.createElement('span'); el.textContent = c; box.appendChild(el); });
      card.appendChild(box);
    }

    if(s.list){
      const ul = document.createElement('ul');
      ul.style.margin = '0 0 4px'; ul.style.paddingLeft = '18px';
      s.list.forEach(item => {
        const li2 = document.createElement('li');
        li2.style.fontSize = '.92rem'; li2.style.lineHeight = '1.7'; li2.style.marginBottom = '4px';
        li2.textContent = item;
        ul.appendChild(li2);
      });
      card.appendChild(ul);
    }

    if(s.bigq){
      const box = document.createElement('div');
      box.className = 'bigq';
      const lab = document.createElement('p'); lab.className = 'label'; lab.textContent = t.bigqLabel;
      const q = document.createElement('p'); q.className = 'q'; q.textContent = '“' + t.bigqQ + '”';
      const how = document.createElement('p'); how.className = 'how'; how.textContent = t.bigqHow;
      box.append(lab, q, how);
      card.appendChild(box);
    }

    if(s.note){ const p = document.createElement('p'); p.className = 'note'; p.innerHTML = render(s.note); card.appendChild(p); }
    if(s.warn){ const p = document.createElement('p'); p.className = 'warn'; p.innerHTML = '⚠️ ' + render(s.warn); card.appendChild(p); }

    li.appendChild(card);
    ol.appendChild(li);
  });
}

function buildTrouble(rows){
  const tb = document.getElementById('troubleBody');
  tb.innerHTML = '';
  rows.forEach(([what, how]) => {
    const tr = document.createElement('tr');
    const td1 = document.createElement('td'); td1.textContent = what;
    const td2 = document.createElement('td'); td2.textContent = how;
    tr.append(td1, td2);
    tb.appendChild(tr);
  });
}

function applyLang(){
  document.documentElement.lang = currentLang;
  const t = L[currentLang];
  document.title = t.title + ' — AiStyle';
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const val = t[el.dataset.i18n];
    if(typeof val === 'string') el.textContent = val;
  });
  buildSteps('steps1', t.steps1, 1, t);
  buildSteps('steps2', t.steps2, t.steps1.length + 1, t);
  buildTrouble(t.trouble);
  document.getElementById('langTH').classList.toggle('active', currentLang === 'th');
  document.getElementById('langEN').classList.toggle('active', currentLang === 'en');
  document.getElementById('langTH').setAttribute('aria-pressed', currentLang === 'th');
  document.getElementById('langEN').setAttribute('aria-pressed', currentLang === 'en');
}

function setLang(lang){
  if(lang !== 'th' && lang !== 'en') return;
  currentLang = lang;
  applyLang();
}

applyLang();
